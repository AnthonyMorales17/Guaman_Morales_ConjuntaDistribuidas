apiVersion: apps/v1
kind: Deployment
metadata:
  name: guamanmorales-audit
  namespace: guamanmorales
  labels:
    app: guamanmorales-audit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guamanmorales-audit
  template:
    metadata:
      labels:
        app: guamanmorales-audit
    spec:
      containers:
        - name: audit-service
          image: guamanmorales-audit:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: AUDIT_PORT
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guamanmorales-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@guamanmorales-audit-postgres-service:5432/audit_db"
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: RABBITMQ_EXCHANGE
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: RABBITMQ_QUEUE
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: CORS_ORIGINS
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
