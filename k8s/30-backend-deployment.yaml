apiVersion: apps/v1
kind: Deployment
metadata:
  name: guamanmorales-backend
  namespace: guamanmorales
  labels:
    app: guamanmorales-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guamanmorales-backend
  template:
    metadata:
      labels:
        app: guamanmorales-backend
    spec:
      containers:
        - name: backend
          image: guamanmorales-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: BACKEND_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: NODE_ENV
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guamanmorales-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@guamanmorales-postgres-service:5432/cavalocal?schema=public"
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: guamanmorales-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: JWT_EXPIRES_IN
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: CORS_ORIGINS
            - name: MAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guamanmorales-secrets
                  key: MAIL_APP_PASSWORD
            - name: MAIL_USER
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: MAIL_USER
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: guamanmorales-config
                  key: GOOGLE_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
